<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fake Pageviews Demo Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container py-5">
    <h1>Fake Pageviews Demo Test</h1>
    <p>This page has been viewed</p>
    <fieldset class="fieldset border p-3 mb-3">
        <legend>Pageviews Test</legend>
        <table>
            <tbody>
                <tr>
                    <td>Start Views:</td>
                    <td><input type="number" id="start_views_display" value="1500" min="1"></td>
                </tr>
                <tr>
                    <td>Start Date:</td>
                    <td><input style="width: stretch;" type="datetime-local" id="start_date_display" value="2022-02-02T02:22:22"></td>
                </tr>
                <tr>
                    <td>Coefficient:</td>
                    <td><input type="number" step="0.1" id="coefficient_display" value="100" min="1"></td>
                </tr>
            </tbody>
        </table>    
    </fieldset>
    <hr>
    <span class="display-6">Pageviews:</span>
    <strong class="display-4" id="views"></strong>
    <pre class="bg-light border rounded mt-3 p-3"><code id="output"></code></pre>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./dist/pageviews.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {

            const startViewsInput = document.querySelector('#start_views_display');
            const startDateInput = document.querySelector('#start_date_display');
            const coefficientInput = document.querySelector('#coefficient_display');
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 2);
            startDateInput.value = yesterday.toISOString().slice(0, 16);
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            startDateInput.max = now.toISOString().slice(0, 16);

            function updatePageviews() {
                const startViews = parseInt(startViewsInput.value, 10);
                const startDate = new Date(startDateInput.value);
                const coefficient = parseFloat(coefficientInput.value);

                const views = pageviews({
                    start_views: startViews,
                    start_date: startDate,
                    coefficient: coefficient
                });

                document.querySelector('#views').innerHTML = new Intl.NumberFormat().format(views);
            
                document.querySelector('#output').textContent = `pageviews({ start_views: ${startViews}, start_date: new Date("${startDate.toISOString()}"), coefficient: ${coefficient} })`;   
            }

            startViewsInput.addEventListener('input', updatePageviews);
            startDateInput.addEventListener('change', updatePageviews);
            coefficientInput.addEventListener('input', updatePageviews);

            // Initial calculation
            updatePageviews();
        });

    </script>
</body>
</html>
